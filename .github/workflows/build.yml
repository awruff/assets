name: build-mods
on:
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mods
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
            21
            17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./build.sh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit new jars
        id: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A jars INDEX.txt
          if git diff --cached --quiet; then echo changed=0 >> "$GITHUB_OUTPUT"; else
            git commit -m "build: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo changed=1 >> "$GITHUB_OUTPUT"
          fi
      - name: Release mods.zip
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drop-in mods folder: flat zip, newest build only (INDEX.txt), and only
          # real Ornithe mods - a fabric.mod.json filters out buildSrc/library jars
          # and the _forge twins of multi-loader repos.
          while read -r j; do
            unzip -l "$j" | grep -qE ' fabric\.mod\.json$' && zip -j -q mods.zip "$j"
          done < INDEX.txt
          tag=build-$(date -u +%Y%m%d-%H%M)
          gh release create "$tag" mods.zip --title "$tag" \
            --notes "Drop-in 1.8.9 Ornithe mods folder ($(unzip -l mods.zip | tail -1 | awk '{print $2}') jars)"
